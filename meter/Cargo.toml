[package]
name = "automagik-meter"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Counts coding-agent token usage per machine as ae/1 rows and publishes a summary doc to herdr-core"
license-file = "../LICENSE"
publish = false

[[bin]]
name = "meter"
path = "src/main.rs"

[lib]
name = "meter"
path = "src/lib.rs"

[dependencies]
memchr = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
