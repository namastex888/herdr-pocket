name: Commit messages

# Every commit a pull request brings is conventional, `type(scope): description`, because the release workflow
# reads the subjects: chore(release), ci, docs and test commits alone don't cut a release.
on:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            subject=$(git log -1 --format=%s "${sha}")
            if ! [[ "${subject}" =~ ^(feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
              echo "::error ::${sha:0:9} is not conventional: ${subject}"
              bad=1
            fi
          done
          exit "${bad}"
