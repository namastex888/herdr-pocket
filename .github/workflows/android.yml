name: Android

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      # Validates the wrapper checksum and caches Gradle dependencies.
      - uses: gradle/actions/setup-gradle@v4

      # Both distributions (docs/rfcs/0006-distribution-flavors.md): github, the GitHub releases with the
      # self-updater, and play, the Google Play bundle without it. Building a variant also runs its
      # verify<Variant>UpdaterManifest check; the play bundle here is debug-signed, only to check it builds.
      - name: Build both flavors, run unit tests and lint
        working-directory: android
        run: >-
          ./gradlew --stacktrace
          :app:assembleGithubDebug :app:testGithubDebugUnitTest :app:lintGithubDebug
          :app:assemblePlayDebug :app:testPlayDebugUnitTest :app:lintPlayDebug
          :app:bundlePlayRelease

      - name: Name APK
        id: apk
        run: |
          version=$(scripts/version.sh current)
          name="automagik-${version}-${GITHUB_SHA::7}-debug.apk"
          cp android/app/build/outputs/apk/github/debug/app-github-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  terminal:
    name: Terminal page (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python android/scripts/test_terminal.py

